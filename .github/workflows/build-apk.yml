name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: ./pujoplan/client
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        working-directory: ./pujoplan/client
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ./pujoplan/client
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./pujoplan/client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uma-Asche-PujoPlan-2026-Debug-APK
          path: pujoplan/client/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
